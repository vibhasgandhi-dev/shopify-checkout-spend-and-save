api_version = "2026-07"

[[extensions]]
name = "Spend & save progress"
handle = "spend-and-save-checkout"
type = "ui_extension"
uid = "1d9f4141-dc72-bd7e-2ae8-2b4fb81484bc8b683afd"
description = "Tier progress in checkout and savings on the thank-you page"

# Static targets: they render automatically once the app is installed, no checkout editor placement needed.
[[extensions.targeting]]
module = "./src/Checkout.jsx"
target = "purchase.checkout.cart-line-list.render-after"

[[extensions.targeting]]
module = "./src/ThankYou.jsx"
target = "purchase.thank-you.customer-information.render-after"

[extensions.capabilities]
api_access = true

# Tier config: same JSON shape as the discount Function's config, on the shop.
[[extensions.metafields]]
namespace = "$app"
key = "tiers"
